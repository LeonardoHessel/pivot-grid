name: CI

on:
  push:
    branches: [main, 2.x]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npx ng build demo

      - name: Test library
        run: npx ng test pivot-grid --watch=false --browsers=ChromeHeadless

      - name: Benchmark engine
        run: npm run bench
        env:
          BENCH_MAX_MS: 500
          BENCH_MAX_50K_MS: 2500




