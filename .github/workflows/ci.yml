name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Build demo
        run: npx ng build demo

      - name: Test library
        run: npx ng test pivot-grid --watch=false --browsers=ChromeHeadless
