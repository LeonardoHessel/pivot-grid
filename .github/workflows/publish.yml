name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:lib

      - name: Verify package
        run: npm run verify:package

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./dist/pivot-grid/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Publish
        run: npm publish ./dist/pivot-grid --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published version
        run: |
          PKG_VERSION=$(node -p "require('./dist/pivot-grid/package.json').version")
          for i in $(seq 1 30); do
            V=$(npm view pivot-grid version 2>/dev/null || true)
            if [ "$V" = "$PKG_VERSION" ]; then
              echo "pivot-grid@$V is available"
              exit 0
            fi
            sleep 10
          done
          echo "pivot-grid@$PKG_VERSION not visible in registry"
          exit 1
