name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:lib

      - name: Verify package
        run: npm run verify:package

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./dist/pivot-grid/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Publish (trusted publishing / OIDC)
        run: |
          TAG=latest
          case "$GITHUB_REF_NAME" in *-rc.*|v0.9.*) TAG=next ;; esac
          npm publish ./dist/pivot-grid --access public --provenance --tag "$TAG"

      - name: Verify published version
        run: |
          PKG_VERSION=$(node -p "require('./dist/pivot-grid/package.json').version")
          EXPECTED_TAG=latest
          case "$GITHUB_REF_NAME" in *-rc.*|v0.9.*) EXPECTED_TAG=next ;; esac
          for i in $(seq 1 30); do
            TAG_VALUE=$(npm view "pivot-grid" "dist-tags.$EXPECTED_TAG" 2>/dev/null || true)
            if [ "$TAG_VALUE" = "$PKG_VERSION" ]; then
              echo "pivot-grid@$PKG_VERSION is available under dist-tag $EXPECTED_TAG"
              exit 0
            fi
            sleep 10
          done
          echo "dist-tag $EXPECTED_TAG does not point to $PKG_VERSION"
          exit 1

