<main>
  <header class="demo-header">
    <div>
      <h1>pivot-grid demo</h1>
      <p>Componente Angular de tabela dinâmica — exemplos por cenário.</p>
    </div>
    <nav class="demo-nav">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </header>

  <router-outlet />
</main>
